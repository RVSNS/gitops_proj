apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-auto-unseal
  namespace: vault
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vault-auto-unseal-role
  namespace: vault
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vault-auto-unseal-binding
  namespace: vault
subjects:
  - kind: ServiceAccount
    name: vault-auto-unseal
roleRef:
  kind: Role
  name: vault-auto-unseal-role
  apiGroup: rbac.authorization.k8s.io
