apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - job.yaml

configMapGenerator:
  - name: vault-policies-script
    namespace: vault
    files:
      - scripts/sync-policies.sh
  - name: vault-policies-definitions
    namespace: vault
    files:
      - policies/vault-tls-demo.hcl
      - roles/vault-tls-demo.json

generatorOptions:
  disableNameSuffixHash: true
