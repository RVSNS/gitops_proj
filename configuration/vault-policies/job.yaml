apiVersion: batch/v1
kind: Job
metadata:
  name: vault-policy-sync-job
  namespace: vault
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  template:
    spec:
      serviceAccountName: vault-auto-unseal
      restartPolicy: OnFailure
      containers:
        - name: policy-sync
          image: bitnami/kubectl:latest
          command: ["/bin/bash", "/scripts/sync-policies.sh"]
          volumeMounts:
            - name: script-vol
              mountPath: /scripts
            - name: defs-vol
              mountPath: /vault-policies
      volumes:
        - name: script-vol
          configMap:
            name: vault-policies-script
            defaultMode: 0755
        - name: defs-vol
          configMap:
            name: vault-policies-definitions
