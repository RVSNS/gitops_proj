apiVersion: vault.banzaicloud.com/v1alpha1
kind: Vault
metadata:
  name: vault
  namespace: vault
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  size: 1
  image: hashicorp/vault:1.15.5
  bankVaultsImage: ghcr.io/bank-vaults/bank-vaults:v1.30.0
  serviceAccount: vault

  # Bootstrap creates vault-tls; the operator reuses its CA for server renewals.
  # Back up this Secret externally. Rotate the root deliberately before expiry;
  # the operator's automatic CA replacement is not a staged PKI rotation.
  tlsAdditionalHosts:
    - vault.vault.svc

  # Copies only the public CA certificate, never the root signing key.
  caNamespaces:
    - cert-manager
    - consul

  config:
    storage:
      file:
        path: /vault/file
    listener:
      tcp:
        address: "0.0.0.0:8200"
        tls_cert_file: /vault/tls/server.crt
        tls_key_file: /vault/tls/server.key
    api_addr: https://vault.vault.svc:8200
    ui: true

  volumeMounts:
    - name: vault-file
      mountPath: /vault/file
  volumeClaimTemplates:
    - metadata:
        name: vault-file
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi

  # Automatic unsealing for local k3d development stored in a K8s secret
  unsealConfig:
    options:
      preFlightChecks: true
    kubernetes:
      secretNamespace: vault
      secretName: vault-unseal-keys

  # Declaratively mounts and configures kv-v2 and pki engines
  externalConfig:
    policies:
      - name: cert-manager
        rules: |
          path "pki/sign/cert-manager" {
            capabilities = ["create", "update"]
          }
      - name: consul-ca
        rules: |
          path "pki/cert/ca" {
            capabilities = ["read"]
          }
      - name: consul-server
        rules: |
          path "pki/cert/ca" {
            capabilities = ["read"]
          }
          path "pki/ca/pem" {
            capabilities = ["read"]
          }
          path "pki/ca_chain" {
            capabilities = ["read"]
          }
          path "pki/issue/consul-server" {
            capabilities = ["create", "update"]
          }
          path "pki/root/sign-intermediate" {
            capabilities = ["update"]
          }
          path "pki_consul/*" {
            capabilities = ["create", "read", "update", "delete", "list"]
          }
          path "sys/mounts/pki_consul" {
            capabilities = ["read"]
          }
          path "sys/mounts/pki_consul/tune" {
            capabilities = ["read", "update"]
          }
          path "secret/data/consul/gossip" {
            capabilities = ["read"]
          }
          path "secret/data/consul/bootstrap" {
            capabilities = ["read"]
          }
      - name: consul-client
        rules: |
          path "pki/cert/ca" {
            capabilities = ["read"]
          }
          path "secret/data/consul/gossip" {
            capabilities = ["read"]
          }
      - name: consul-acl-init
        rules: |
          path "pki/cert/ca" {
            capabilities = ["read"]
          }
          path "secret/data/consul/bootstrap" {
            capabilities = ["read", "create", "update"]
          }
      - name: consul-feature-gate
        rules: |
          path "pki/cert/ca" {
            capabilities = ["read"]
          }
          path "secret/data/consul/bootstrap" {
            capabilities = ["read"]
          }
      - name: consul-credentials
        rules: |
          path "secret/data/consul/gossip" {
            capabilities = ["read", "create", "update"]
          }
          path "secret/data/consul/bootstrap" {
            capabilities = ["read", "create", "update"]
          }

    auth:
      - type: kubernetes
        # Setting kubernetes_host skips the configurer's defaults, so Vault reviews
        # tokens with its own auto-rotated service account token and cluster CA.
        config:
          kubernetes_host: https://kubernetes.default.svc
        roles:
          - name: cert-manager
            bound_service_account_names: ["vault-issuer"]
            bound_service_account_namespaces: ["cert-manager"]
            audience: vault://vault-issuer
            policies: ["cert-manager"]
            ttl: 20m
          - name: consul-server
            bound_service_account_names: ["consul-server"]
            bound_service_account_namespaces: ["consul"]
            policies: ["consul-server"]
            ttl: 1h
          - name: consul-client
            bound_service_account_names: ["consul-client"]
            bound_service_account_namespaces: ["consul"]
            policies: ["consul-client"]
            ttl: 1h
          - name: consul-ca
            bound_service_account_names:
              - consul-server
              - consul-client
              - consul-server-acl-init
              - consul-feature-gate-set
            bound_service_account_namespaces: ["consul"]
            policies: ["consul-ca"]
            ttl: 20m
          - name: consul-acl-init
            bound_service_account_names: ["consul-server-acl-init"]
            bound_service_account_namespaces: ["consul"]
            policies: ["consul-acl-init"]
            ttl: 20m
          - name: consul-feature-gate
            bound_service_account_names: ["consul-feature-gate-set"]
            bound_service_account_namespaces: ["consul"]
            policies: ["consul-feature-gate"]
            ttl: 20m
          - name: consul-credentials
            bound_service_account_names: ["consul-vault-bootstrap"]
            bound_service_account_namespaces: ["consul"]
            policies: ["consul-credentials"]
            ttl: 10m

    secrets:
      - path: secret
        type: kv
        description: "KV Version 2 engine"
        options:
          version: "2"
      - path: pki
        type: pki
        description: "PKI using the operator-managed TLS root CA"
        config:
          default_lease_ttl: 24h
          max_lease_ttl: 720h
        configuration:
          config:
            - name: ca
              # file escapes PEM newlines for the configurer's JSON template.
              pem_bundle: '${ file `/vault/tls/ca.crt` }${ file `/vault/tls/ca.key` }'
            - name: urls
              issuing_certificates: https://vault.vault.svc:8200/v1/pki/ca
              crl_distribution_points: https://vault.vault.svc:8200/v1/pki/crl
          roles:
            - name: cert-manager
              allowed_domains: ["svc", "svc.cluster.local", "localhost"]
              allow_subdomains: true
              allow_localhost: true
              allow_ip_sans: true
              key_type: any
              require_cn: false
              ttl: 24h
              max_ttl: 720h
            - name: consul-server
              allowed_domains:
                - server.dc1.consul
                - consul-server
                - consul-server.consul
                - consul-server.consul.svc
                - consul-server.consul.svc.cluster.local
                - consul-ui.consul.svc
                - consul-ui.consul.svc.cluster.local
                - localhost
              allow_bare_domains: true
              allow_subdomains: true
              allow_localhost: true
              allow_ip_sans: true
              server_flag: true
              client_flag: true
              key_type: ec
              key_bits: 256
              ttl: 24h
              max_ttl: 72h
      - path: pki_consul
        type: pki
        description: "Consul client auto-encryption intermediate; signed by the shared Vault root"
        config:
          default_lease_ttl: 24h
          max_lease_ttl: 720h

  serviceType: ClusterIP