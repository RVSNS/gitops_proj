apiVersion: v1
kind: ServiceAccount
metadata:
  name: consul-vault-bootstrap
  namespace: consul
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: consul-vault-bootstrap
  namespace: consul
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["consul-gossip-encryption-key", "consul-bootstrap-acl-token"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: consul-vault-bootstrap
  namespace: consul
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: consul-vault-bootstrap
subjects:
  - kind: ServiceAccount
    name: consul-vault-bootstrap
    namespace: consul
---
apiVersion: batch/v1
kind: Job
metadata:
  name: consul-vault-bootstrap
  namespace: consul
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 600
  template:
    metadata:
      annotations:
        vault.hashicorp.com/agent-inject: "false"
    spec:
      serviceAccountName: consul-vault-bootstrap
      restartPolicy: Never
      volumes:
        - name: ca
          secret:
            secretName: vault-tls
            items:
              - key: ca.crt
                path: ca.crt
        - name: work
          emptyDir:
            medium: Memory
      containers:
        - name: bootstrap
          image: alpine/k8s:1.35.0
          command: ["/bin/bash", "-euo", "pipefail", "-c"]
          args:
            - |
              umask 077
              cd /work
              vault=https://vault.vault.svc:8200
              jq -n --rawfile jwt /var/run/secrets/kubernetes.io/serviceaccount/token \
                '{role: "consul-credentials", jwt: $jwt}' > login.json
              curl --fail-with-body --silent --show-error --cacert /ca/ca.crt \
                --data @login.json "$vault/v1/auth/kubernetes/login" > auth.json
              jq -er '"header = \"X-Vault-Token: " + .auth.client_token + "\""' \
                auth.json > curl.conf

              for item in gossip bootstrap; do
                if [ "$item" = gossip ]; then
                  name=consul-gossip-encryption-key
                  key=key
                else
                  name=consul-bootstrap-acl-token
                  key=token
                fi
                kubectl -n consul get secret "$name" --ignore-not-found -o json > existing.json
                code=$(curl --silent --show-error --cacert /ca/ca.crt --config curl.conf \
                  --output stored.json --write-out '%{http_code}' \
                  "$vault/v1/secret/data/consul/$item")
                if [ "$code" = 200 ]; then
                  jq -e --arg key "$key" '.data.data[$key] | type == "string"' stored.json > /dev/null
                  if [ -s existing.json ]; then
                    jq -er --arg key "$key" '.data[$key] | select(length > 0)' existing.json |
                      base64 -d > existing.value
                    jq -jr --arg key "$key" '.data.data[$key]' stored.json > stored.value
                    cmp existing.value stored.value || {
                      echo "Vault and Kubernetes $item credentials differ; refusing to overwrite." >&2
                      exit 1
                    }
                  fi
                  echo "Reusing Vault $item credential."
                elif [ "$code" = 404 ]; then
                  if [ -s existing.json ]; then
                    jq -er --arg key "$key" '.data[$key] | select(length > 0)' existing.json |
                      base64 -d > value
                  elif [ "$item" = gossip ]; then
                    openssl rand -base64 32 | tr -d '\n' > value
                  else
                    # The chart bootstraps ACLs and writes the token on a fresh install.
                    : > value
                  fi
                  jq -n --arg key "$key" --rawfile value value \
                    '{options: {cas: 0}, data: {($key): $value}}' > payload.json
                  curl --fail-with-body --silent --show-error --cacert /ca/ca.crt \
                    --config curl.conf --data @payload.json \
                    "$vault/v1/secret/data/consul/$item" > written.json
                  echo "Initialized Vault $item credential without replacing existing credentials."
                else
                  echo "Vault read for $item failed with HTTP $code:" >&2
                  cat stored.json >&2
                  exit 1
                fi
              done
          volumeMounts:
            - name: ca
              mountPath: /ca
              readOnly: true
            - name: work
              mountPath: /work
