apiVersion: batch/v1
kind: Job
metadata:
  name: vault-tls-demo-config-job
  namespace: vault
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  template:
    spec:
      serviceAccountName: vault-auto-unseal
      restartPolicy: OnFailure
      containers:
        - name: configurator
          image: bitnami/kubectl:latest
          command: ["/bin/bash", "/scripts/config-kv.sh"]
          volumeMounts:
            - name: script-vol
              mountPath: /scripts
      volumes:
        - name: script-vol
          configMap:
            name: vault-tls-demo-config-script
            defaultMode: 0755
