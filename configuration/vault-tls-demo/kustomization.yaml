apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - rbac.yaml
  - certificate.yaml
  - vault-config-job.yaml
  - deployment.yaml
  - service.yaml

configMapGenerator:
  - name: vault-tls-demo-config-script
    namespace: vault
    files:
      - scripts/config-kv.sh

generatorOptions:
  disableNameSuffixHash: true
