apiVersion: batch/v1
kind: Job
metadata:
  name: vault-kv-setup-job
  namespace: vault
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  template:
    spec:
      serviceAccountName: vault-auto-unseal
      restartPolicy: OnFailure
      containers:
        - name: kv-setup
          image: bitnami/kubectl:latest
          command: ["/bin/bash", "/scripts/enable-kv.sh"]
          volumeMounts:
            - name: script-vol
              mountPath: /scripts
      volumes:
        - name: script-vol
          configMap:
            name: vault-kv-setup-script
            defaultMode: 0755
