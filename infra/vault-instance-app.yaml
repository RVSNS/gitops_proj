apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vault-instance
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://github.com/RVSNS/gitops_proj.git
    targetRevision: master
    path: configuration/vault
  destination:
    server: https://kubernetes.default.svc
    namespace: vault
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true