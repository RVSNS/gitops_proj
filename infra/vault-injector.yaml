apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vault-injector
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: https://helm.releases.hashicorp.com
    chart: vault
    targetRevision: 0.32.0
    helm:
      releaseName: vault-injector
      valuesObject:
        global:
          externalVaultAddr: https://vault.vault.svc:8200
          tlsDisable: false
        server:
          enabled: false
          authDelegator:
            enabled: false
        injector:
          enabled: true
          agentImage:
            tag: "1.15.5"
          webhook:
            failurePolicy: Fail
            namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: consul
  destination:
    server: https://kubernetes.default.svc
    namespace: vault
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      name: vault-injector-agent-injector-cfg
      jqPathExpressions:
        - .webhooks[].clientConfig.caBundle
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
