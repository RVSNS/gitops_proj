apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: consul
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  project: default
  source:
    repoURL: https://helm.releases.hashicorp.com
    chart: consul
    targetRevision: 2.1.0
    helm:
      releaseName: consul
      valuesObject:
        global:
          name: consul
          datacenter: dc1
          argocd:
            enabled: true
          acls:
            manageSystemACLs: true
            bootstrapToken:
              secretName: secret/data/consul/bootstrap
              secretKey: token
          gossipEncryption:
            autoGenerate: false
            secretName: secret/data/consul/gossip
            secretKey: key
          secretsBackend:
            vault:
              enabled: true
              consulServerRole: consul-server
              consulClientRole: consul-client
              consulCARole: consul-ca
              manageSystemACLsRole: consul-acl-init
              featureGateSetRole: consul-feature-gate
              ca:
                secretName: vault-tls
                secretKey: ca.crt
              connectCA:
                address: https://vault.vault.svc:8200
                rootPKIPath: pki
                intermediatePKIPath: pki_consul
                additionalConfig: |
                  {
                    "connect": [{
                      "ca_config": [{
                        "intermediate_cert_ttl": "168h",
                        "leaf_cert_ttl": "24h"
                      }]
                    }]
                  }
          tls:
            enabled: true
            verify: true
            httpsOnly: true
            enableAutoEncrypt: true
            caCert:
              secretName: pki/cert/ca
            serverAdditionalDNSSANs:
              - consul-server.consul.svc.cluster.local
              - consul-ui.consul.svc
              - consul-ui.consul.svc.cluster.local
        server:
          enabled: true
          # The internal CA is needed for client auto-encryption, not mesh injection.
          connect: true
          serverCert:
            secretName: pki/issue/consul-server
          extraConfig: |
            {"auto_reload_config": true}
          replicas: 1
          bootstrapExpect: 1
          storage: 1Gi
        client:
          enabled: true
        connectInject:
          enabled: false
        ui:
          enabled: true
          service:
            type: ClusterIP
        tests:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: consul
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
