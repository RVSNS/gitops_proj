apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vault-kv-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5" # Runs after vault-pki-config, infra-level like it
spec:
  project: default
  source:
    repoURL: 'https://github.com/RVSNS/gitops_proj.git'
    targetRevision: HEAD
    path: configuration/vault-kv
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: vault
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
