apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vault-pki-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  project: default
  source:
    repoURL: 'https://github.com/YOUR_USERNAME/YOUR_REPO.git' # Update this!
    targetRevision: HEAD
    path: configuration/vault-pki
  destination:
    server: 'https://kubernetes.default.svc'
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
