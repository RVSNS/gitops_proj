apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vault-tls-demo
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: default
  source:
    repoURL: 'https://github.com/RVSNS/gitops_proj.git'
    targetRevision: HEAD
    path: configuration/vault-tls-demo
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
